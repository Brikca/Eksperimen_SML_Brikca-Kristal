name: Telco Preprocessing Workflow

on:
  push:
    branches:
      - main

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install pandas
          pip install numpy
          pip install scikit-learn

      - name: Run Preprocessing
        run: |
          python preprocessing/automate_Brikca-Kristal.py

      - name: Upload Processed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: telco-preprocessed
          path: preprocessing/telco_preprocessed.csv
